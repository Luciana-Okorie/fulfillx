version: "3.9"

# Full FulfillX stack: API Gateway, four business services, one
# shared Kafka broker, one Postgres instance with a separate database
# per service (service-per-database — no service reads another's
# tables directly, only via events), and Redis for the Order
# Service's idempotency/rate-limit layer.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["15432:5432"]
    volumes:
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.1
    ports: ["19092:9092"]
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  # All-in-one Jaeger: accepts OTLP directly (no separate collector
  # needed for a single-node demo) and serves the trace UI.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  order-service:
    build: ./order-service
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fulfillx_order?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPICS_DOWNSTREAM: inventory-events,payment-events,fulfillment-events
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: "8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      jaeger:
        condition: service_started

  inventory-service:
    build: ./inventory-service
    ports: ["8081:8081"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fulfillx_inventory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_ORDER_EVENTS: order-events
      KAFKA_TOPIC_INVENTORY_EVENTS: inventory-events
      KAFKA_CONSUMER_GROUP: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: "8081"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      jaeger:
        condition: service_started

  payment-service:
    build: ./payment-service
    ports: ["8082:8082"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fulfillx_payment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_INVENTORY_EVENTS: inventory-events
      KAFKA_TOPIC_PAYMENT_EVENTS: payment-events
      KAFKA_CONSUMER_GROUP: payment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: "8082"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      jaeger:
        condition: service_started

  fulfillment-service:
    build: ./fulfillment-service
    ports: ["8083:8083"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fulfillx_fulfillment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_PAYMENT_EVENTS: payment-events
      KAFKA_TOPIC_FULFILLMENT_EVENTS: fulfillment-events
      KAFKA_CONSUMER_GROUP: fulfillment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: "8083"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      jaeger:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    ports: ["8000:8000"]
    environment:
      ORDER_SERVICE_URL: http://order-service:8080
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPICS_DOWNSTREAM: inventory-events,payment-events,fulfillment-events
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PORT: "8000"
    depends_on:
      - order-service
      - kafka
      - jaeger