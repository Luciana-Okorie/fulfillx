name: FulfillX CI

# One pipeline covering all five services. Each service also has its
# own CI workflow (service-dir/.github/workflows/ci.yml) for faster
# per-service feedback on PRs that only touch one service; this root
# workflow is the full-system gate that also runs the cross-service
# integration smoke test docker-compose alone can't express.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-unit-test:
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, fulfillment-service, api-gateway]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go vet ./...
      - run: go test ./... -short -race -cover

  build-images:
    needs: lint-and-unit-test
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, fulfillment-service, api-gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: false
          tags: fulfillx/${{ matrix.service }}:${{ github.sha }}

  # This is the test the challenge specifically asks for: bring up
  # the real event chain (Postgres x4, Redis, Kafka, all five
  # services) via docker-compose and prove an order actually flows
  # Order -> Inventory -> Payment -> Fulfillment end to end, not just
  # that each service passes its own unit tests in isolation.
  integration-smoke-test:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bring up full stack
        run: docker compose up -d --build
      - name: wait for services
        run: |
          for port in 8080 8081 8082 8083 8000; do
            timeout 90 bash -c "until curl -sf http://localhost:$port/healthz; do sleep 2; done"
          done
      - name: place an order and verify it reaches FULFILLED
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8000/orders \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ci-smoke-$(date +%s)" \
            -d '{"customer_id":"ci-smoke","items":[{"sku":"SKU-1","quantity":1,"unit_price_cents":1000}]}')
          ORDER_ID=$(echo "$RESPONSE" | jq -r .id)
          echo "created order $ORDER_ID"
          for i in $(seq 1 15); do
            STATUS=$(curl -sf http://localhost:8080/orders/$ORDER_ID/status | jq -r .status)
            echo "status: $STATUS"
            if [ "$STATUS" = "FULFILLED" ]; then exit 0; fi
            sleep 2
          done
          echo "order did not reach FULFILLED in time"
          exit 1
      - name: dump logs on failure
        if: failure()
        run: docker compose logs

  security-scan:
    needs: integration-smoke-test
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, fulfillment-service, api-gateway]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  deploy:
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "deploy step placeholder - wire kubectl apply -f k8s/ (or Helm) with real cluster credentials here"
