apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: fulfillx
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: fulfillx/order-service:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: fulfillx-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: fulfillx-db-credentials, key: DATABASE_URL_ORDER } }
            - name: PORT
              value: "8080"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: fulfillx
spec:
  selector: { app: order-service }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: fulfillx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
