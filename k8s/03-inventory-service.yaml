apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: fulfillx
spec:
  replicas: 2
  selector:
    matchLabels: { app: inventory-service }
  template:
    metadata:
      labels: { app: inventory-service }
    spec:
      containers:
        - name: inventory-service
          image: fulfillx/inventory-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: fulfillx-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: fulfillx-db-credentials, key: DATABASE_URL_INVENTORY } }
            - name: KAFKA_CONSUMER_GROUP
              value: "inventory-service"
            - name: PORT
              value: "8081"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: fulfillx
spec:
  selector: { app: inventory-service }
  ports: [{ port: 8081, targetPort: 8081 }]
