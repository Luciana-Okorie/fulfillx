apiVersion: v1
kind: Namespace
metadata:
  name: fulfillx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fulfillx-config
  namespace: fulfillx
data:
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC_ORDER_EVENTS: "order-events"
  KAFKA_TOPIC_INVENTORY_EVENTS: "inventory-events"
  KAFKA_TOPIC_PAYMENT_EVENTS: "payment-events"
  KAFKA_TOPIC_FULFILLMENT_EVENTS: "fulfillment-events"
  KAFKA_TOPICS_DOWNSTREAM: "inventory-events,payment-events,fulfillment-events"
  REDIS_ADDR: "redis:6379"
  ORDER_SERVICE_URL: "http://order-service:8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
---
# Demo-only credentials. In a real cluster this would be created out
# of band (sealed-secrets, external-secrets, or a manual `kubectl
# create secret`) rather than committed to the repo — checked in here
# only so the manifests are runnable end to end for review.
apiVersion: v1
kind: Secret
metadata:
  name: fulfillx-db-credentials
  namespace: fulfillx
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL_ORDER: "postgres://postgres:postgres@postgres:5432/fulfillx_order?sslmode=disable"
  DATABASE_URL_INVENTORY: "postgres://postgres:postgres@postgres:5432/fulfillx_inventory?sslmode=disable"
  DATABASE_URL_PAYMENT: "postgres://postgres:postgres@postgres:5432/fulfillx_payment?sslmode=disable"
  DATABASE_URL_FULFILLMENT: "postgres://postgres:postgres@postgres:5432/fulfillx_fulfillment?sslmode=disable"
