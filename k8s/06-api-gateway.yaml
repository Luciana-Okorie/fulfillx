apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fulfillx
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: fulfillx/api-gateway:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: fulfillx-config }
          env:
            - name: PORT
              value: "8000"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fulfillx
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8000, targetPort: 8000 }]
  type: ClusterIP
---
# Optional: expose externally via an Ingress controller (nginx, etc).
# WebSocket upgrade requires the controller to forward the Upgrade/
# Connection headers — the nginx-ingress annotations below assume
# that controller; swap for the equivalent on other controllers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fulfillx-gateway
  namespace: fulfillx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: fulfillx.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8000 }
